<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Playground | Me-API</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 API Playground</h1>
            <p>Test and explore the Me-API endpoints</p>
            <div style="margin-top: 15px;">
                <a href="index.html" style="color: white; background: rgba(255,255,255,0.2); padding: 8px 20px; border-radius: 8px; text-decoration: none; font-weight: 500;">👨‍💻 View Profile</a>
            </div>
        </header>

        <main>
            <section id="health-section">
                <h2>API Health</h2>
                <button id="check-health">🔍 Check Health</button>
                <span id="health-status"></span>
            </section>

            <section id="profile-section">
                <h2>Profile Management</h2>
                
                <div style="margin-bottom: 20px;">
                    <button id="toggle-profile-form" onclick="document.getElementById('profile-form').style.display = document.getElementById('profile-form').style.display === 'none' ? 'block' : 'none';">➕ Add/Update Profile</button>
                    <button onclick="window.location.href='index.html'">👤 View Profile Page</button>
                </div>
                
                <div id="profile-form" style="display: none; padding: 20px; background: #f8f9fa; border-radius: 12px; margin-bottom: 20px;">
                    <h3 style="margin-bottom: 15px;">Profile Information</h3>
                    
                    <input type="text" id="profile-name" placeholder="Full Name *" style="width: 100%; margin-bottom: 10px;">
                    <input type="email" id="profile-email" placeholder="Email *" style="width: 100%; margin-bottom: 10px;">
                    <input type="text" id="profile-education" placeholder="Education (e.g., MCA, Bhubaneswar)" style="width: 100%; margin-bottom: 10px;">
                    
                    <h4 style="margin: 15px 0 10px 0;">Links</h4>
                    <input type="url" id="profile-github" placeholder="GitHub URL" style="width: 100%; margin-bottom: 10px;">
                    <input type="url" id="profile-linkedin" placeholder="LinkedIn URL" style="width: 100%; margin-bottom: 10px;">
                    <input type="url" id="profile-portfolio" placeholder="Portfolio URL (optional)" style="width: 100%; margin-bottom: 10px;">
                    
                    <h4 style="margin: 15px 0 10px 0;">Skills</h4>
                    <input type="text" id="profile-skills" placeholder="Skills (comma-separated, e.g., JavaScript, Python, Node.js)" style="width: 100%; margin-bottom: 10px;">
                    
                    <h4 style="margin: 15px 0 10px 0;">Work Experience</h4>
                    <textarea id="profile-work" placeholder="Work experience (one per line)" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; margin-bottom: 10px; min-height: 100px; font-family: inherit;"></textarea>
                    
                    <h4 style="margin: 15px 0 10px 0;">Projects</h4>
                    <div id="projects-container">
                        <div class="project-input" style="background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px;">
                            <input type="text" class="project-title" placeholder="Project Title" style="width: 100%; margin-bottom: 8px;">
                            <textarea class="project-description" placeholder="Project Description" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; margin-bottom: 8px; min-height: 60px; font-family: inherit;"></textarea>
                            <input type="text" class="project-links" placeholder="Project Links (comma-separated URLs)" style="width: 100%; margin-bottom: 8px;">
                            <input type="text" class="project-skills" placeholder="Project Skills (comma-separated)" style="width: 100%;">
                        </div>
                    </div>
                    <button id="add-project-field" onclick="addProjectField()" style="background: #28a745; margin-bottom: 15px;">➕ Add Another Project</button>
                    
                    <div>
                        <button id="save-profile" onclick="saveProfile()">💾 Save Profile</button>
                        <button id="cancel-profile-form" onclick="document.getElementById('profile-form').style.display='none'" style="background: #6c757d;">❌ Cancel</button>
                    </div>
                </div>
            </section>

            <section id="search-section">
                <h2>Search</h2>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="🔎 Search skills, projects, work...">
                    <button id="search-btn">Search</button>
                </div>
                <div id="search-results" class="data-container"></div>
            </section>

            <section id="projects-section">
                <h2>Projects</h2>
                <div class="filter-box">
                    <input type="text" id="skill-filter" placeholder="🏷️ Filter by skill (e.g., python)">
                    <button id="filter-projects">Filter</button>
                    <button id="load-all-projects">Load All</button>
                </div>
                <div id="projects-data" class="data-container"></div>
            </section>

            <section id="skills-section">
                <h2>Top Skills</h2>
                <button id="load-top-skills">📊 Load Top Skills</button>
                <div id="skills-data" class="data-container"></div>
            </section>
        </main>

        <footer>
            <p>Built with ❤️ by <a href="https://github.com/Rohit299-ue" target="_blank">Rohit Rohan Tripathy</a></p>
            <p style="margin-top: 10px; opacity: 0.8;">
                <a href="https://www.linkedin.com/in/rohit-rohan-tripathy-07a8ab213" target="_blank">LinkedIn</a>
            </p>
        </footer>
    </div>

    <script src="app.js"></script>
    <script>
        // Inline functions for immediate availability
        function addProjectField() {
            const container = document.getElementById('projects-container');
            const projectDiv = document.createElement('div');
            projectDiv.className = 'project-input';
            projectDiv.style.cssText = 'background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; position: relative;';
            projectDiv.innerHTML = `
                <button onclick="this.parentElement.remove()" style="position: absolute; top: 10px; right: 10px; background: #dc3545; padding: 4px 8px; font-size: 0.8em;">✕</button>
                <input type="text" class="project-title" placeholder="Project Title" style="width: 100%; margin-bottom: 8px;">
                <textarea class="project-description" placeholder="Project Description" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; margin-bottom: 8px; min-height: 60px; font-family: inherit;"></textarea>
                <input type="text" class="project-links" placeholder="Project Links (comma-separated URLs)" style="width: 100%; margin-bottom: 8px;">
                <input type="text" class="project-skills" placeholder="Project Skills (comma-separated)" style="width: 100%;">
            `;
            container.appendChild(projectDiv);
        }

        async function saveProfile() {
            const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? 'http://localhost:3000'
                : 'https://me-api-backend-tuvm.onrender.com';

            const name = document.getElementById('profile-name').value.trim();
            const email = document.getElementById('profile-email').value.trim();
            const education = document.getElementById('profile-education').value.trim();
            const github = document.getElementById('profile-github').value.trim();
            const linkedin = document.getElementById('profile-linkedin').value.trim();
            const portfolio = document.getElementById('profile-portfolio').value.trim();
            const skillsStr = document.getElementById('profile-skills').value.trim();
            const workStr = document.getElementById('profile-work').value.trim();
            
            if (!name || !email) {
                alert('Name and Email are required!');
                return;
            }
            
            const skills = skillsStr ? skillsStr.split(',').map(s => s.trim()).filter(s => s) : [];
            const work = workStr ? workStr.split('\n').map(w => w.trim()).filter(w => w) : [];
            
            // Collect projects
            const projectInputs = document.querySelectorAll('.project-input');
            const projects = [];
            projectInputs.forEach(input => {
                const title = input.querySelector('.project-title').value.trim();
                if (title) {
                    const description = input.querySelector('.project-description').value.trim();
                    const linksStr = input.querySelector('.project-links').value.trim();
                    const skillsStr = input.querySelector('.project-skills').value.trim();
                    
                    projects.push({
                        title,
                        description,
                        links: linksStr ? linksStr.split(',').map(l => l.trim()).filter(l => l) : [],
                        skills: skillsStr ? skillsStr.split(',').map(s => s.trim()).filter(s => s) : []
                    });
                }
            });
            
            const profileData = {
                name,
                email,
                education,
                skills,
                work,
                projects,
                links: {
                    github,
                    linkedin,
                    portfolio
                }
            };
            
            try {
                // Try to update first
                let response = await fetch(`${API_BASE}/profile`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(profileData)
                });
                
                // If profile doesn't exist, create it
                if (response.status === 404) {
                    response = await fetch(`${API_BASE}/profile`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(profileData)
                    });
                }
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || `HTTP ${response.status}`);
                }
                
                alert('Profile saved successfully! Redirecting to profile page...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            } catch (error) {
                alert(`Error saving profile: ${error.message}`);
                console.error('Save error:', error);
            }
        }
    </script>
</body>
</html>
