<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Playground | Me-API</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 API Playground</h1>
            <p>Test and explore the Me-API endpoints</p>
            <div style="margin-top: 15px;">
                <a href="index.html" style="color: white; background: rgba(255,255,255,0.2); padding: 8px 20px; border-radius: 8px; text-decoration: none; font-weight: 500;">👨‍💻 View Profile</a>
            </div>
        </header>

        <main>
            <section id="health-section">
                <h2>API Health</h2>
                <button id="check-health">🔍 Check Health</button>
                <span id="health-status"></span>
            </section>

            <section id="profile-section">
                <h2>Profile Management</h2>
                <button onclick="window.location.href='index.html'">👤 View Profile Page</button>
            </section>

            <section id="search-section">
                <h2>Search</h2>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="🔎 Search skills, projects, work...">
                    <button id="search-btn">Search</button>
                </div>
                <div id="search-results" class="data-container"></div>
            </section>

            <section id="projects-section">
                <h2>Projects</h2>
                <div class="filter-box">
                    <input type="text" id="skill-filter" placeholder="🏷️ Filter by skill (e.g., python)">
                    <button id="filter-projects">Filter</button>
                    <button id="load-all-projects">Load All</button>
                </div>
                <div id="projects-data" class="data-container"></div>
            </section>

            <section id="skills-section">
                <h2>Top Skills</h2>
                <button id="load-top-skills">📊 Load Top Skills</button>
                <div id="skills-data" class="data-container"></div>
            </section>
        </main>

        <footer>
            <p>Built with ❤️ by <a href="https://github.com/Rohit299-ue" target="_blank">Rohit Rohan Tripathy</a></p>
            <p style="margin-top: 10px; opacity: 0.8;">
                <a href="https://www.linkedin.com/in/rohit-rohan-tripathy-07a8ab213" target="_blank">LinkedIn</a>
            </p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
