<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me-API Playground | Rohit Rohan Tripathy</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Me-API Playground</h1>
            <p>A personal profile REST API explorer by Rohit Rohan Tripathy</p>
        </header>

        <main>
            <section id="health-section">
                <h2>API Health</h2>
                <button id="check-health">🔍 Check Health</button>
                <span id="health-status"></span>
            </section>

            <section id="profile-section">
                <h2>My Profile</h2>
                <button id="load-profile">👤 Load Profile</button>
                <div id="profile-data" class="data-container"></div>
            </section>

            <section id="search-section">
                <h2>Search</h2>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="🔎 Search skills, projects, work...">
                    <button id="search-btn">Search</button>
                </div>
                <div id="search-results" class="data-container"></div>
            </section>

            <section id="projects-section">
                <h2>Projects</h2>
                <div class="filter-box">
                    <input type="text" id="skill-filter" placeholder="🏷️ Filter by skill (e.g., python)">
                    <button id="filter-projects">Filter</button>
                    <button id="load-all-projects">Load All</button>
                    <button id="show-add-project">➕ Add Project</button>
                </div>
                
                <div id="add-project-form" style="display: none; margin-bottom: 20px; padding: 20px; background: #f8f9fa; border-radius: 12px;">
                    <h3 style="margin-bottom: 15px;">Add New Project</h3>
                    <input type="text" id="project-title" placeholder="Project Title" style="width: 100%; margin-bottom: 10px;">
                    <textarea id="project-description" placeholder="Project Description" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; margin-bottom: 10px; min-height: 80px; font-family: inherit;"></textarea>
                    <input type="text" id="project-links" placeholder="Links (comma-separated)" style="width: 100%; margin-bottom: 10px;">
                    <input type="text" id="project-skills" placeholder="Skills (comma-separated)" style="width: 100%; margin-bottom: 10px;">
                    <button id="submit-project">✅ Add Project</button>
                    <button id="cancel-project" style="background: #6c757d;">❌ Cancel</button>
                </div>
                
                <div id="projects-data" class="data-container"></div>
            </section>

            <section id="skills-section">
                <h2>Top Skills</h2>
                <button id="load-top-skills">📊 Load Top Skills</button>
                <div id="skills-data" class="data-container"></div>
            </section>
        </main>

        <footer>
            <p>Built with ❤️ by <a href="https://github.com/Rohit299-ue" target="_blank">Rohit Rohan Tripathy</a></p>
            <p style="margin-top: 10px; opacity: 0.8;">
                <a href="https://www.linkedin.com/in/rohit-rohan-tripathy-07a8ab213" target="_blank">LinkedIn</a>
            </p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
