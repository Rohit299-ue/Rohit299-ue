<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rohit Rohan Tripathy | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍💻</text></svg>">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="header-name">👨‍💻 Loading...</h1>
            <p id="header-subtitle">Please wait...</p>
            <div style="margin-top: 15px;">
                <a href="playground.html" style="color: white; background: rgba(255,255,255,0.2); padding: 8px 20px; border-radius: 8px; text-decoration: none; font-weight: 500;">🚀 API Playground</a>
            </div>
        </header>

        <main>
            <section id="profile-section">
                <div id="profile-data" class="data-container">
                    <p class="loading">Loading profile...</p>
                </div>
            </section>
        </main>

        <footer>
            <p>Built with ❤️ by <a href="https://github.com/Rohit299-ue" target="_blank">Rohit Rohan Tripathy</a></p>
            <p style="margin-top: 10px; opacity: 0.8;">
                <a href="https://www.linkedin.com/in/rohit-rohan-tripathy-07a8ab213" target="_blank">LinkedIn</a>
            </p>
        </footer>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3000'
            : 'https://me-api-backend-tuvm.onrender.com';

        async function apiCall(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        function renderProfile(profile) {
            return `
                <div class="profile-card">
                    <h3>${profile.name}</h3>
                    <p><strong>Email:</strong> ${profile.email}</p>
                    <p><strong>Education:</strong> ${profile.education || 'N/A'}</p>
                    
                    <div class="links-section">
                        <h4>Links</h4>
                        ${profile.links.github ? `<a href="${profile.links.github}" target="_blank">GitHub</a>` : ''}
                        ${profile.links.linkedin ? `<a href="${profile.links.linkedin}" target="_blank">LinkedIn</a>` : ''}
                        ${profile.links.portfolio ? `<a href="${profile.links.portfolio}" target="_blank">Portfolio</a>` : ''}
                    </div>
                    
                    <div style="margin-top: 15px;">
                        <h4>Skills</h4>
                        ${profile.skills.map(s => `<span class="skill-tag">${s}</span>`).join('')}
                    </div>
                    
                    <div style="margin-top: 15px;">
                        <h4>Work Experience</h4>
                        ${profile.work.map(w => `<div class="work-item">${w}</div>`).join('')}
                    </div>
                    
                    <div style="margin-top: 15px;">
                        <h4>Projects (${profile.projects.length})</h4>
                        ${profile.projects.map(renderProject).join('')}
                    </div>
                </div>
            `;
        }

        function renderProject(project) {
            return `
                <div class="project-card">
                    <h4>${project.title}</h4>
                    <p>${project.description || ''}</p>
                    <div>
                        ${project.links?.map(l => `<a href="${l}" target="_blank">View</a>`).join('') || ''}
                    </div>
                    <div>
                        ${project.skills?.map(s => `<span class="skill-tag">${s}</span>`).join('') || ''}
                    </div>
                </div>
            `;
        }

        // Auto-load profile on page load
        window.addEventListener('load', async () => {
            const container = document.getElementById('profile-data');
            const headerName = document.getElementById('header-name');
            const headerSubtitle = document.getElementById('header-subtitle');
            
            try {
                const profile = await apiCall('/profile');
                container.innerHTML = renderProfile(profile);
                
                // Update header with user data
                headerName.textContent = `👨‍💻 ${profile.name}`;
                headerSubtitle.textContent = profile.education || 'Developer';
            } catch (error) {
                // Show friendly message instead of error
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #666;">
                        <h3 style="margin-bottom: 15px;">👋 Welcome!</h3>
                        <p style="margin-bottom: 20px;">No profile found. Create your profile to get started.</p>
                        <a href="playground.html" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 500;">🚀 Create Profile</a>
                    </div>
                `;
                headerName.textContent = '👨‍💻 Welcome';
                headerSubtitle.textContent = 'Create your profile to get started';
            }
        });
    </script>
</body>
</html>
